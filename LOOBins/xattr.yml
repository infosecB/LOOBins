name: xattr
author: Jason Trost (@jason_trost)
short_description: Display and manipulate extended attributes.
full_description: The xattr command can be used to display, modify or remove the extended attributes of one or more files, including directories and symbolic links.  Extended attributes are arbitrary metadata stored with a file, but separate from the filesystem attributes (such as modification time or file size).  The metadata is often a null-terminated UTF-8 string, but can also be arbitrary binary data.  xattr can be used to bypass Gatekeeper.
created: 2023-04-20
example_use_cases:
- name: Bypass Gatekeeper via xattr
  description: Use xattr to remove quarantine extended attribute from a file.
  code: xattr -d com.apple.quarantine FILE
  tactics:
  - Execution
  - Defense Evasion
  tags:
  - xattr
  - quarantine
- name: Bypass Gatekeeper via xattr
  description: Use xattr to remove quarantine extended attribute from multiple files or directories.
  code: xattr -d -r com.apple.quarantine *
  tactics:
  - Execution
  - Defense Evasion
  tags:
  - xattr
  - quarantine
- name: Clear extended attributes from a file via xattr
  description: Use xattr -c to clear a file's extended attributes. This removes com.apple.quarantine when present without naming it, so the command line does not contain the string com.apple.quarantine. AMOS ran this form on a dropped payload before executing it.
  code: xattr -c FILE
  tactics:
  - Execution
  - Defense Evasion
  tags:
  - xattr
  - quarantine
- name: Recursively clear extended attributes via xattr
  description: Use xattr -cr to clear extended attributes, including com.apple.quarantine, across an app bundle or directory tree. Seen in MacSync and CrashStealer infections.
  code: xattr -cr DIRECTORY
  tactics:
  - Execution
  - Defense Evasion
  tags:
  - xattr
  - quarantine
paths:
- /usr/bin/xattr
