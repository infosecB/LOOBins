---
name: Script Editor
author: Liran Ravich (Cribl)
short_description: Create, edit, compile and run AppleScript and JavaScript for Automation scripts.
full_description: Script Editor is Apple's built-in application for writing, compiling and running AppleScript and JavaScript for Automation (JXA) scripts. It registers the applescript URL scheme, so a link in a web page can open Script Editor with script text already filled in. Attackers have used this in ClickFix-style campaigns to move the user-run step out of Terminal, and away from its paste warning in macOS Tahoe 26.4. The user still has to allow the browser to open Script Editor and then click Run.
created: 2026-10-08
example_use_cases:
- name: Open a pre-filled script from a web page via the applescript URL scheme
  description: A malicious web page opens an applescript URL, which launches Script Editor with attacker-supplied script text in a new document. The user is told to click Run. Jamf Threat Labs (Atomic Stealer) and SentinelOne (SHub Reaper) observed this. The script content is left as a placeholder here.
  code: applescript://com.apple.scripteditor?action=new&script=<URL-ENCODED_APPLESCRIPT>
  tactics:
  - Initial Access
  - Execution
  - Defense Evasion
  tags:
  - applescript
  - url-scheme
  - clickfix
  - script-editor
paths:
- /System/Applications/Utilities/Script Editor.app/Contents/MacOS/Script Editor
detections:
