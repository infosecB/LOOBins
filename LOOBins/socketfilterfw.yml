    url: https://github.com/jamf/jamfprotect/blob/main/custom_analytic_detections/system_config_activity/application_firewall_config_changes.yaml
  - name: "Splunk: MacOS List Firewall Rules (socketfilterfw --getglobalstate execution)"
    url: https://research.splunk.com/endpoint/f8db6e0b-55bb-40ca-bc85-2b3700adb0f8/
  - name: "Sigma: System Network Discovery - macOS (process image path ends with /socketfilterfw)"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_susp_system_network_discovery.yml
