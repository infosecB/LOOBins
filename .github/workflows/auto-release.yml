name: Auto Release to PyPI

# Nightly: release whatever has landed on main since the last release.
# Skips when nothing under LOOBins/, src/, or pyproject.toml has changed.

on:
  schedule:
    - cron: '0 6 * * *' # Daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false

# Queue releases instead of racing: overlapping runs read the same version
# and collide on the tag and the version-bump push.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  changes:
    name: Check for unreleased changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Each release tags its version-bump commit with the bare version, so
      # the tag matching pyproject.toml marks the last release.
      - name: Diff against last release
        id: diff
        run: |
          CURRENT_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced release"
            echo "release=true" >> $GITHUB_OUTPUT
          elif ! git rev-parse -q --verify "refs/tags/$CURRENT_VERSION" >/dev/null; then
            echo "No tag for $CURRENT_VERSION; releasing"
            echo "release=true" >> $GITHUB_OUTPUT
          elif git diff --quiet "$CURRENT_VERSION" HEAD -- LOOBins src pyproject.toml; then
            echo "No changes since $CURRENT_VERSION; skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            git diff --stat "$CURRENT_VERSION" HEAD -- LOOBins src pyproject.toml
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # setup-python doesn't publish every version for every runner image
      # (3.9 is missing on Ubuntu 26.04), so get tox's interpreters from uv.
      - name: Install Python 3.9-3.12
        run: uv python install 3.9 3.10 3.11 3.12

      - name: Install dependencies
        run: uv sync --group dev

      # tox.ini skips missing interpreters for local runs; in CI a missing
      # version must fail instead of silently passing.
      - name: Run Tox
        run: uv run tox --skip-missing-interpreters false

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          if git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            echo "::error::Tag $NEW_VERSION already exists; pyproject.toml is behind the latest release"
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # Push the bump before publishing anything, so a rejected push can't
      # leave a release on PyPI that main doesn't know about.
      - name: Commit and push version bump
        id: bump
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase https://${PAT_TOKEN}@github.com/infosecB/LOOBins.git main
          git push https://${PAT_TOKEN}@github.com/infosecB/LOOBins.git HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build project for distribution
        run: uv build

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Automated release for version ${{ steps.version.outputs.version }}

            Published to PyPI: https://pypi.org/project/PyLOOBins/${{ steps.version.outputs.version }}/
          commit: ${{ steps.bump.outputs.sha }}
          makeLatest: true

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
