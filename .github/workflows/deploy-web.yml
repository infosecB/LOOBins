name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'LOOBins/**'
      - 'src/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Generated with pyloobins so the site serves exactly what the SDK exports.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export ATT&CK Navigator layer and STIX bundle
        run: |
          uv run --no-dev pyloobins export-navigator --path web/public --file-name loobins_navigator_layer.json
          uv run --no-dev pyloobins export-stix --path web/public --file-name loobins_stix.json

      - name: Build site
        working-directory: web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
