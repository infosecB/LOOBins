name: Validate LOOBins

on: [pull_request]

jobs:
  validate_loobin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
    - name: Checkout branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # uv provides managed interpreters for every supported version and, given
    # python-version, creates and activates a venv for later steps.
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pyloobins from local source
      run: uv pip install .
    - name: Validate the full LOOBins corpus with local pyloobins
      run: |
        status=0
        for file in LOOBins/*.yml; do
          pyloobins validate --path "$file" || status=1
        done
        exit $status
